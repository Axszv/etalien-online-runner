name: etalien-arm64-redroid-probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download private APK fixture
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p artifacts diagnostics
          gh release download android-fixture-v3.13.10 \
            --pattern android_ETAPP_v3.13.10_.apk \
            --dir artifacts

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install native ARM host tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y adb jq
          uname -a | tee diagnostics/host.txt
          lscpu | tee -a diagnostics/host.txt
          docker version | tee diagnostics/docker-version.txt

      - name: Enable Android Binder devices
        shell: bash
        run: |
          set -x
          if ! sudo modprobe binder_linux devices=binder,hwbinder,vndbinder; then
            sudo apt-get install -y "linux-modules-extra-$(uname -r)" || true
            sudo modprobe binder_linux devices=binder,hwbinder,vndbinder
          fi
          ls -l /dev/binder /dev/hwbinder /dev/vndbinder | tee diagnostics/binder.txt

      - name: Start native ARM64 Redroid
        shell: bash
        run: |
          docker pull redroid/redroid:12.0.0_64only-latest
          docker run -d --name redroid --privileged \
            -p 5555:5555 \
            redroid/redroid:12.0.0_64only-latest \
            androidboot.redroid_width=1080 \
            androidboot.redroid_height=2280 \
            androidboot.redroid_dpi=420 \
            androidboot.redroid_gpu_mode=guest \
            ro.product.model=25060RK16C \
            ro.product.brand=REDMI \
            ro.product.manufacturer=REDMI

      - name: Probe the mobile reward page
        env:
          ETALIEN_TOKEN: ${{ secrets.ETALIEN_TOKEN }}
          ETALIEN_DVC: ${{ secrets.ETALIEN_DVC }}
        shell: bash
        run: |
          if [[ -z "$ETALIEN_TOKEN" || -z "$ETALIEN_DVC" ]]; then
            echo "ETALIEN_TOKEN and ETALIEN_DVC must be configured."
            exit 1
          fi
          bash scripts/redroid-mobile-probe.sh \
            artifacts/android_ETAPP_v3.13.10_.apk \
            diagnostics

      - name: Collect Redroid logs
        if: always()
        shell: bash
        run: docker logs redroid > diagnostics/redroid.log 2>&1 || true

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-redroid-probe-${{ github.run_id }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 7
