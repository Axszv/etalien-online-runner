name: etalien-arm64-redroid-probe

on:
  workflow_dispatch:
    inputs:
      reward_attempts:
        description: Number of genuine PC acceleration rewarded ads to attempt
        required: true
        default: "0"
        type: choice
        options:
          - "0"
          - "1"
      redroid_image:
        description: Native ARM64 Redroid image to test
        required: true
        default: "redroid/redroid:11.0.0-latest"
        type: choice
        options:
          - "redroid/redroid:11.0.0-latest"
          - "redroid/redroid:12.0.0_64only-latest"
          - "redroid/redroid:10.0.0-latest"
      gpu_mode:
        description: Redroid graphics backend
        required: true
        default: "guest"
        type: choice
        options:
          - "guest"
          - "auto"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download private APK fixture
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p artifacts diagnostics
          gh release download android-fixture-v3.13.10 \
            --pattern android_ETAPP_v3.13.10_.apk \
            --dir artifacts

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install native ARM host tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y adb jq
          uname -a | tee diagnostics/host.txt
          lscpu | tee -a diagnostics/host.txt
          docker version | tee diagnostics/docker-version.txt
          {
            echo "redroid_image=${{ inputs.redroid_image }}"
            echo "redroid_gpu_mode=${{ inputs.gpu_mode }}"
            ls -la /dev/dri 2>&1 || true
            lspci -nnk 2>&1 || true
          } > diagnostics/host-graphics.txt

      - name: Enable Android Binder devices
        shell: bash
        run: |
          set -euxo pipefail
          if ! sudo modprobe binder_linux; then
            sudo apt-get install -y "linux-modules-extra-$(uname -r)" || true
            sudo modprobe binder_linux
          fi
          {
            modinfo binder_linux || true
            find /sys/module/binder_linux/parameters -maxdepth 1 -type f \
              -exec sh -c 'printf "%s=" "$1"; cat "$1"' sh {} \; || true
            grep -E 'CONFIG_ANDROID_BINDER_(IPC|DEVICES)|CONFIG_ANDROID_BINDERFS' \
              "/boot/config-$(uname -r)" || true
          } | tee diagnostics/binder.txt

      - name: Start native ARM64 Redroid
        env:
          REDROID_IMAGE: ${{ inputs.redroid_image }}
          REDROID_GPU_MODE: ${{ inputs.gpu_mode }}
        shell: bash
        run: |
          docker pull "$REDROID_IMAGE"
          docker run -d --name redroid --privileged \
            -p 5555:5555 \
            "$REDROID_IMAGE" \
            androidboot.redroid_width=1080 \
            androidboot.redroid_height=2280 \
            androidboot.redroid_dpi=420 \
            androidboot.redroid_gpu_mode="$REDROID_GPU_MODE" \
            ro.product.model=25060RK16C \
            ro.product.brand=REDMI \
            ro.product.manufacturer=REDMI

      - name: Wait for Android inside Redroid
        shell: bash
        run: bash scripts/redroid-container-probe.sh diagnostics

      - name: Probe the My Games PC reward page
        env:
          ETALIEN_TOKEN: ${{ secrets.ETALIEN_TOKEN }}
          ETALIEN_DVC: ${{ secrets.ETALIEN_DVC }}
          ETALIEN_AD_ATTEMPTS: ${{ inputs.reward_attempts }}
        shell: bash
        run: |
          if [[ -z "$ETALIEN_TOKEN" || -z "$ETALIEN_DVC" ]]; then
            echo "ETALIEN_TOKEN and ETALIEN_DVC must be configured."
            exit 1
          fi
          set +e
          timeout --kill-after=15s 10m bash scripts/redroid-mobile-probe.sh \
            artifacts/android_ETAPP_v3.13.10_.apk \
            diagnostics
          probe_code=$?
          pkill -9 adb || true
          exit "$probe_code"

      - name: Collect Redroid logs
        if: always()
        env:
          ETALIEN_TOKEN: ${{ secrets.ETALIEN_TOKEN }}
        shell: bash
        run: |
          docker ps -a --no-trunc > diagnostics/docker-ps.txt 2>&1 || true
          docker inspect redroid > diagnostics/redroid-inspect.json 2>&1 || true
          docker logs --timestamps redroid > diagnostics/redroid.log 2>&1 || true
          timeout --kill-after=2s 15s docker exec redroid \
            /system/bin/logcat -b all -d \
            > diagnostics/container-logcat.txt 2>&1 || true
          timeout --kill-after=2s 15s docker exec redroid \
            /system/bin/dumpsys media.codec \
            > diagnostics/media-codec.txt 2>&1 || true
          mkdir -p diagnostics/tombstones
          docker cp redroid:/data/tombstones/. diagnostics/tombstones/ \
            > diagnostics/tombstones-copy.txt 2>&1 || true
          sudo dmesg --ctime | tail -n 2000 > diagnostics/dmesg.txt 2>&1 || true
          if [[ -n "$ETALIEN_TOKEN" ]]; then
            node -e 'const fs=require("fs"); const p="diagnostics/container-logcat.txt"; if (fs.existsSync(p)) fs.writeFileSync(p,fs.readFileSync(p,"utf8").split(process.env.ETALIEN_TOKEN).join("[REDACTED]"));'
          fi

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-redroid-probe-${{ github.run_id }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 7
