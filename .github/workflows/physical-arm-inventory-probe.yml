name: etalien-physical-arm-inventory-probe

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: etalien-physical-arm-inventory-probe
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: etalien-spark-runner-20260721
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/794398120804/locations/global/workloadIdentityPools/github-actions/providers/etalien-repo
  GCP_SERVICE_ACCOUNT: etalien-testlab-runner@etalien-spark-runner-20260721.iam.gserviceaccount.com

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Check required session secrets
        env:
          ETALIEN_TOKEN: ${{ secrets.ETALIEN_TOKEN }}
          ETALIEN_DVC: ${{ secrets.ETALIEN_DVC }}
        shell: bash
        run: |
          if [[ -z "$ETALIEN_TOKEN" || -z "$ETALIEN_DVC" ]]; then
            echo "ETALIEN_TOKEN and ETALIEN_DVC must be configured."
            exit 1
          fi

      - name: Download private APK fixture
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p artifacts
          gh release download android-fixture-v3.13.10 \
            --pattern android_ETAPP_v3.13.10_.apk \
            --dir artifacts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build Test Lab fixtures
        shell: bash
        run: |
          bash scripts/build-testlab-fixtures.sh \
            artifacts/android_ETAPP_v3.13.10_.apk \
            testlab-build

      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Assert Cloud Billing is disabled
        shell: bash
        run: |
          billing_enabled="$(gcloud billing projects describe "$GCP_PROJECT_ID" \
            --format='value(billingEnabled)')"
          echo "billingEnabled=$billing_enabled"
          if [[ "${billing_enabled,,}" == "true" ]]; then
            echo "Refusing to submit a Test Lab matrix while Cloud Billing is enabled."
            exit 1
          fi

      - name: Probe rewarded-ad inventory on one stable physical ARM device
        env:
          ETALIEN_TOKEN: ${{ secrets.ETALIEN_TOKEN }}
          ETALIEN_DVC: ${{ secrets.ETALIEN_DVC }}
        shell: bash
        run: |
          gcloud firebase test android run \
            --project "$GCP_PROJECT_ID" \
            --type instrumentation \
            --app testlab-build/etalien-testlab-signed.apk \
            --test testlab-build/etalien-cloudtest.apk \
            --device model=redfin,version=30,locale=zh_CN,orientation=portrait \
            --timeout 12m \
            --environment-variables \
              "ETALIEN_TOKEN=$ETALIEN_TOKEN,ETALIEN_DVC=$ETALIEN_DVC,ETALIEN_DIAGNOSTIC_ONLY=true" \
            --results-history-name etalien-physical-arm-inventory-probe \
            --client-details matrixLabel=physical-arm-inventory-only \
            --no-auto-google-login \
            --no-performance-metrics \
            --quiet 2>&1 | tee testlab-build/physical-probe.log

      - name: Upload Test Lab submission log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etalien-physical-arm-inventory-probe-${{ github.run_id }}
          path: testlab-build/physical-probe.log
          if-no-files-found: ignore
          retention-days: 14
