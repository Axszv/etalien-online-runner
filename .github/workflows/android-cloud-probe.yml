name: android-cloud-probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Download private APK fixture
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p artifacts diagnostics
          gh release download android-fixture-v3.13.10 \
            --pattern android_ETAPP_v3.13.10_.apk \
            --dir artifacts

      - name: Enable KVM access
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot Android and probe application
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: arm64-v8a
          profile: pixel_4
          cores: 2
          ram-size: 3072M
          disable-linux-hw-accel: auto
          disable-animations: true
          emulator-options: >-
            -no-window -noaudio -no-boot-anim
            -gpu swiftshader_indirect
            -camera-back none -camera-front none
          script: bash scripts/android-cloud-probe.sh artifacts/android_ETAPP_v3.13.10_.apk diagnostics

      - name: Upload probe diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-cloud-probe-${{ github.run_id }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 7
