name: android-cloud-probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Download private APK fixture
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p artifacts diagnostics
          gh release download android-fixture-v3.13.10 \
            --pattern android_ETAPP_v3.13.10_.apk \
            --dir artifacts

      - name: Enable KVM access
        shell: bash
        run: |
          if [[ -e /dev/kvm ]]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          else
            echo "KVM is unavailable; the emulator action will use same-architecture software execution."
          fi

      - name: Boot Android and probe application
        uses: ReactiveCircus/android-emulator-runner@v2
        env:
          ETALIEN_TOKEN: ${{ secrets.ETALIEN_TOKEN }}
          ETALIEN_DVC: ${{ secrets.ETALIEN_DVC }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 3072M
          disable-linux-hw-accel: auto
          disable-animations: true
          emulator-options: >-
            -no-window -noaudio -no-boot-anim
            -gpu swiftshader_indirect
            -camera-back none -camera-front none
            -prop ro.product.model=25060RK16C
            -prop ro.product.manufacturer=REDMI
            -prop ro.product.brand=REDMI
            -prop ro.product.name=onyx
            -prop ro.product.device=onyx
            -prop ro.build.characteristics=default
          script: |
            bash scripts/configure-ldplayer-like-device.sh diagnostics
            bash scripts/android-cloud-probe.sh artifacts/android_ETAPP_v3.13.10_.apk diagnostics

      - name: Upload probe diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-cloud-probe-${{ github.run_id }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 7
