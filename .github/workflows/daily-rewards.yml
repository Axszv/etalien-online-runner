name: etalien-daily-rewards

on:
  workflow_dispatch:
    inputs:
      mobile_ads:
        description: Max mobile ladder ads to watch (0 = skip)
        required: true
        default: "7"
        type: string
      pc_ads:
        description: Max PC ads per run (staged chain, 0 = report only)
        required: true
        default: "15"
        type: string
      apk_pin:
        description: "Pin the Android build to this version (e.g. 3.17.10) instead of resolving the latest"
        required: false
        default: ""
        type: string
      redroid_image:
        description: Native ARM64 Redroid image
        required: true
        default: "redroid/redroid:12.0.0_64only-latest"
        type: choice
        options:
          - "redroid/redroid:12.0.0_64only-latest"
          - "redroid/redroid:11.0.0-latest"
      gpu_mode:
        description: Redroid graphics backend
        required: true
        default: "guest"
        type: choice
        options:
          - "guest"
          - "auto"
  schedule:
    # One daily run is enough: the script keeps retrying (with cooldowns) and
    # follows the staged PC chain until everything is claimed, so the second
    # same-day cron was only ever a fallback for the old give-up-early logic.
    - cron: "17 1 * * *"

permissions:
  contents: read

concurrency:
  group: etalien-daily-rewards
  cancel-in-progress: false

jobs:
  rewards:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      # Resolve the build the same way the official site does, so the container
      # never runs a version the app is being forced to upgrade from. The
      # endpoint is the one et001.com calls when you click 手机端; it needs no
      # token, only the x-eta header. Falls back to the pinned release asset
      # when the lookup fails.
      - name: Resolve APK fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          apk="artifacts/android_ETAPP_latest.apk"
          url=""
          pin="${{ inputs.apk_pin }}"
          if [[ -n "$pin" ]]; then
            url="https://file.et-cdn.com/upd/android/ETAPP_v${pin}.apk"
            echo "pinned to $pin"
          elif resp="$(curl -fsS -m 30 -X POST \
              https://api.et-api.com/v2/booster/app/update/info/get \
              -H 'content-type: application/json' \
              -H 'x-eta: os=2&ver=1.0.0&dvc=FFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFF&ch=h5' \
              -d '{"os":"Mobile"}' 2>/dev/null)"; then
            url="$(printf '%s' "$resp" | jq -r '.download_url // empty')"
          fi
          if [[ -n "$url" ]] && curl -fsSL -m 300 -o "$apk" "$url"; then
            echo "resolved the current build from $url"
          else
            echo "::warning::could not resolve the current build; using the pinned fixture"
            rm -f "$apk"
            GH_TOKEN="${{ github.token }}" gh release download android-fixture-v3.17.10 \
              --pattern android_ETAPP_v3.17.10.apk \
              --dir artifacts
            apk="artifacts/android_ETAPP_v3.17.10.apk"
          fi
          # A build that dropped the resource ids the runner drives would fail
          # every round, so reject it here instead of burning the container.
          unzip -p "$apk" resources.arsc > artifacts/resources.arsc
          for name in UIPCDurationCard UISwitch UIClose UISubmit UIChangeLog; do
            if ! grep -qa "$name" artifacts/resources.arsc; then
              echo "::error::$apk does not contain $name; refusing to run it"
              exit 1
            fi
          done
          echo "using $apk ($(stat -c%s "$apk") bytes)"
          echo "ETALIEN_APK=$apk" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Rotate the session token before the expensive container work: a token
      # that is about to expire would otherwise kill the run at the protocol
      # step, and refreshing is cheap. Falls back to a phone login when the
      # stored token is already rejected.
      - name: Renew ETAlien session
        env:
          ETALIEN_TOKEN: ${{ secrets.ETALIEN_TOKEN }}
          ETALIEN_DVC: ${{ secrets.ETALIEN_DVC }}
          ETALIEN_CHANNEL: ${{ secrets.ETALIEN_CHANNEL }}
          ETALIEN_PHONE: ${{ secrets.ETALIEN_PHONE }}
          ETALIEN_PASSWORD: ${{ secrets.ETALIEN_PASSWORD }}
          GH_PAT: ${{ secrets.GH_PAT }}
        shell: bash
        run: |
          set +e
          renew_out="$(node scripts/renew-token.mjs 2>&1)"
          renew_code=$?
          if (( renew_code != 0 )); then
            echo "renewal failed (exit $renew_code); continuing with the stored token"
            echo "$renew_out" | grep -avE '^token=' | tail -n 5
            # Keep the stored token so the reward step still has one.
            echo "ETALIEN_TOKEN=$ETALIEN_TOKEN" >> "$GITHUB_ENV"
            exit 0
          fi
          new_token="$(sed -n 's/^token=//p' <<<"$renew_out" | head -n 1)"
          source="$(sed -n 's/^source=//p' <<<"$renew_out" | head -n 1)"
          if [[ -z "$new_token" ]]; then
            echo "renewal produced no token; continuing with the stored token"
            echo "ETALIEN_TOKEN=$ETALIEN_TOKEN" >> "$GITHUB_ENV"
            exit 0
          fi
          # Keep the rotated token out of the log: it is a live credential and
          # this repository is public.
          echo "::add-mask::$new_token"
          echo "renewed via $source"
          # Hand the fresh token to the reward step without printing it.
          echo "ETALIEN_TOKEN=$new_token" >> "$GITHUB_ENV"
          if [[ -n "$GH_PAT" ]]; then
            if printf '%s' "$new_token" | GH_TOKEN="$GH_PAT" gh secret set ETALIEN_TOKEN \
                --repo "$GITHUB_REPOSITORY" 2>/dev/null; then
              echo "stored the renewed token in the ETALIEN_TOKEN secret"
            else
              echo "warning: could not update the ETALIEN_TOKEN secret"
            fi
          else
            echo "GH_PAT is not configured; the renewed token is only used for this run"
          fi

      - name: Install native ARM host tools
        shell: bash
        run: |
          mkdir -p diagnostics
          sudo apt-get update
          sudo apt-get install -y adb jq
          uname -a | tee diagnostics/host.txt
          docker version | tee diagnostics/docker-version.txt

      - name: Enable Android Binder devices
        shell: bash
        run: |
          set -euxo pipefail
          if ! sudo modprobe binder_linux; then
            sudo apt-get install -y "linux-modules-extra-$(uname -r)" || true
            sudo modprobe binder_linux
          fi
          find /sys/module/binder_linux/parameters -maxdepth 1 -type f \
            -exec sh -c 'printf "%s=" "$1"; cat "$1"' sh {} \; \
            | tee diagnostics/binder.txt

      - name: Start native ARM64 Redroid
        env:
          REDROID_IMAGE: ${{ inputs.redroid_image || 'redroid/redroid:12.0.0_64only-latest' }}
          REDROID_GPU_MODE: ${{ inputs.gpu_mode || 'guest' }}
        shell: bash
        run: |
          docker pull "$REDROID_IMAGE"
          docker run -d --name redroid --privileged \
            -p 5555:5555 \
            "$REDROID_IMAGE" \
            androidboot.redroid_width=1080 \
            androidboot.redroid_height=2280 \
            androidboot.redroid_dpi=420 \
            androidboot.redroid_gpu_mode="$REDROID_GPU_MODE" \
            ro.product.model=25060RK16C \
            ro.product.brand=REDMI \
            ro.product.manufacturer=REDMI

      - name: Wait for Android inside Redroid
        shell: bash
        run: bash scripts/redroid-container-probe.sh diagnostics

      - name: Watch daily rewarded ads
        env:
          ETALIEN_DVC: ${{ secrets.ETALIEN_DVC }}
          ETALIEN_CHANNEL: ${{ secrets.ETALIEN_CHANNEL }}
          ETALIEN_MOBILE_ADS: ${{ inputs.mobile_ads || '7' }}
          ETALIEN_PC_ADS: ${{ inputs.pc_ads || '15' }}
          ETALIEN_TOTAL_BUDGET: "19500"
        shell: bash
        run: |
          if [[ -z "$ETALIEN_TOKEN" || -z "$ETALIEN_DVC" ]]; then
            echo "ETALIEN_TOKEN and ETALIEN_DVC must be configured."
            exit 1
          fi
          set +e
          timeout --kill-after=15s 330m bash scripts/redroid-rewards.sh \
            "$ETALIEN_APK" \
            diagnostics
          probe_code=$?
          pkill -9 adb || true
          exit "$probe_code"

      - name: Collect Redroid logs
        if: always()
        env:
          # The renewed token arrives through GITHUB_ENV; the stored one is
          # redacted as well in case it still shows up in the logs.
          ETALIEN_OLD_TOKEN: ${{ secrets.ETALIEN_TOKEN }}
          ETALIEN_DVC: ${{ secrets.ETALIEN_DVC }}
        shell: bash
        run: |
          docker ps -a --no-trunc > diagnostics/docker-ps.txt 2>&1 || true
          docker inspect redroid > diagnostics/redroid-inspect.json 2>&1 || true
          docker logs --timestamps redroid > diagnostics/redroid.log 2>&1 || true
          timeout --kill-after=2s 15s docker exec redroid \
            /system/bin/logcat -b all -d \
            > diagnostics/container-logcat.txt 2>&1 || true
          timeout --kill-after=2s 15s docker exec redroid \
            /system/bin/dumpsys media.codec \
            > diagnostics/media-codec.txt 2>&1 || true
          mkdir -p diagnostics/tombstones
          docker cp redroid:/data/tombstones/. diagnostics/tombstones/ \
            > diagnostics/tombstones-copy.txt 2>&1 || true
          sudo dmesg --ctime | tail -n 2000 > diagnostics/dmesg.txt 2>&1 || true
          if [[ -n "$ETALIEN_TOKEN" || -n "$ETALIEN_DVC" || -n "$ETALIEN_OLD_TOKEN" ]]; then
            node -e '
              const fs = require("fs");
              const secrets = [process.env.ETALIEN_TOKEN, process.env.ETALIEN_OLD_TOKEN, process.env.ETALIEN_DVC].filter(Boolean);
              const files = ["diagnostics/container-logcat.txt", "diagnostics/media-codec.txt", "diagnostics/redroid.log"];
              for (const p of files) {
                if (!fs.existsSync(p)) continue;
                let s = fs.readFileSync(p, "utf8");
                for (const secret of secrets) s = s.split(secret).join("[REDACTED]");
                fs.writeFileSync(p, s);
              }
            '
          fi

      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etalien-daily-rewards-${{ github.run_id }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 7
