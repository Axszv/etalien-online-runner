name: etalien-daily-rewards

on:
  workflow_dispatch:
    inputs:
      mobile_ads:
        description: Max mobile ladder ads to watch (0 = skip)
        required: true
        default: "7"
        type: string
      pc_ads:
        description: Max PC ladder ads to watch (0 = report page only)
        required: true
        default: "9"
        type: string
      redroid_image:
        description: Native ARM64 Redroid image
        required: true
        default: "redroid/redroid:12.0.0_64only-latest"
        type: choice
        options:
          - "redroid/redroid:12.0.0_64only-latest"
          - "redroid/redroid:11.0.0-latest"
      gpu_mode:
        description: Redroid graphics backend
        required: true
        default: "guest"
        type: choice
        options:
          - "guest"
          - "auto"
  schedule:
    # Beijing 09:17 with a second same-day attempt as a self-healing catch-up.
    # Runs only on the default branch.
    - cron: "17 1 * * *"
    - cron: "23 13 * * *"

permissions:
  contents: read

concurrency:
  group: etalien-daily-rewards
  cancel-in-progress: false

jobs:
  rewards:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Restore APK fixture cache
        id: apk-cache
        uses: actions/cache/restore@v4
        with:
          path: artifacts/android_ETAPP_v3.13.10_.apk
          key: etalien-apk-android-fixture-v3.13.10

      - name: Download private APK fixture
        if: steps.apk-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p artifacts
          gh release download android-fixture-v3.13.10 \
            --pattern android_ETAPP_v3.13.10_.apk \
            --dir artifacts

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install native ARM host tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y adb jq
          uname -a | tee diagnostics/host.txt
          docker version | tee diagnostics/docker-version.txt

      - name: Enable Android Binder devices
        shell: bash
        run: |
          set -euxo pipefail
          if ! sudo modprobe binder_linux; then
            sudo apt-get install -y "linux-modules-extra-$(uname -r)" || true
            sudo modprobe binder_linux
          fi
          find /sys/module/binder_linux/parameters -maxdepth 1 -type f \
            -exec sh -c 'printf "%s=" "$1"; cat "$1"' sh {} \; \
            | tee diagnostics/binder.txt

      - name: Start native ARM64 Redroid
        env:
          REDROID_IMAGE: ${{ inputs.redroid_image || 'redroid/redroid:12.0.0_64only-latest' }}
          REDROID_GPU_MODE: ${{ inputs.gpu_mode || 'guest' }}
        shell: bash
        run: |
          docker pull "$REDROID_IMAGE"
          docker run -d --name redroid --privileged \
            -p 5555:5555 \
            "$REDROID_IMAGE" \
            androidboot.redroid_width=1080 \
            androidboot.redroid_height=2280 \
            androidboot.redroid_dpi=420 \
            androidboot.redroid_gpu_mode="$REDROID_GPU_MODE" \
            ro.product.model=25060RK16C \
            ro.product.brand=REDMI \
            ro.product.manufacturer=REDMI

      - name: Wait for Android inside Redroid
        shell: bash
        run: bash scripts/redroid-container-probe.sh diagnostics

      - name: Watch daily rewarded ads
        env:
          ETALIEN_TOKEN: ${{ secrets.ETALIEN_TOKEN }}
          ETALIEN_DVC: ${{ secrets.ETALIEN_DVC }}
          ETALIEN_CHANNEL: ${{ secrets.ETALIEN_CHANNEL }}
          ETALIEN_MOBILE_ADS: ${{ inputs.mobile_ads || '7' }}
          ETALIEN_PC_ADS: ${{ inputs.pc_ads || '9' }}
          ETALIEN_TOTAL_BUDGET: "4400"
        shell: bash
        run: |
          if [[ -z "$ETALIEN_TOKEN" || -z "$ETALIEN_DVC" ]]; then
            echo "ETALIEN_TOKEN and ETALIEN_DVC must be configured."
            exit 1
          fi
          set +e
          timeout --kill-after=15s 75m bash scripts/redroid-rewards.sh \
            artifacts/android_ETAPP_v3.13.10_.apk \
            diagnostics
          probe_code=$?
          pkill -9 adb || true
          exit "$probe_code"

      - name: Save APK fixture cache
        if: steps.apk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: artifacts/android_ETAPP_v3.13.10_.apk
          key: etalien-apk-android-fixture-v3.13.10

      - name: Collect Redroid logs
        if: always()
        env:
          ETALIEN_TOKEN: ${{ secrets.ETALIEN_TOKEN }}
          ETALIEN_DVC: ${{ secrets.ETALIEN_DVC }}
        shell: bash
        run: |
          docker ps -a --no-trunc > diagnostics/docker-ps.txt 2>&1 || true
          docker inspect redroid > diagnostics/redroid-inspect.json 2>&1 || true
          docker logs --timestamps redroid > diagnostics/redroid.log 2>&1 || true
          timeout --kill-after=2s 15s docker exec redroid \
            /system/bin/logcat -b all -d \
            > diagnostics/container-logcat.txt 2>&1 || true
          timeout --kill-after=2s 15s docker exec redroid \
            /system/bin/dumpsys media.codec \
            > diagnostics/media-codec.txt 2>&1 || true
          mkdir -p diagnostics/tombstones
          docker cp redroid:/data/tombstones/. diagnostics/tombstones/ \
            > diagnostics/tombstones-copy.txt 2>&1 || true
          sudo dmesg --ctime | tail -n 2000 > diagnostics/dmesg.txt 2>&1 || true
          if [[ -n "$ETALIEN_TOKEN" || -n "$ETALIEN_DVC" ]]; then
            node -e '
              const fs = require("fs");
              const secrets = [process.env.ETALIEN_TOKEN, process.env.ETALIEN_DVC].filter(Boolean);
              const files = ["diagnostics/container-logcat.txt", "diagnostics/media-codec.txt", "diagnostics/redroid.log"];
              for (const p of files) {
                if (!fs.existsSync(p)) continue;
                let s = fs.readFileSync(p, "utf8");
                for (const secret of secrets) s = s.split(secret).join("[REDACTED]");
                fs.writeFileSync(p, s);
              }
            '
          fi

      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etalien-daily-rewards-${{ github.run_id }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 30
